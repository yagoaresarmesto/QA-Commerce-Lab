name: Release

# Publishes the all-in-one image to GitHub Container Registry and, if configured,
# deploys it to the VPS. Runs on every push to main and manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/qa-commerce-lab

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          base=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$base:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "latest=$base:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    # Enable by creating the repository variable DEPLOY_TARGET=vps and the secrets VPS_HOST, VPS_USER, VPS_SSH_KEY.
    if: vars.DEPLOY_TARGET == 'vps'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh "$USER@$HOST" "cd /opt/qa-commerce-lab/deploy/vps && git -C /opt/qa-commerce-lab pull --ff-only && IMAGE=$IMAGE ./deploy.sh"
      - name: Remote smoke check
        if: vars.TESTING_URL != ''
        run: |
          for i in $(seq 1 20); do
            curl -fsS "${{ vars.TESTING_URL }}/api/health/ready" && exit 0
            sleep 6
          done
          exit 1
