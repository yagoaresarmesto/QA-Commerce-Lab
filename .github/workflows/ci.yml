name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w apps/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: API integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qacl
          POSTGRES_PASSWORD: qacl
          POSTGRES_DB: qacl_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qacl" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qacl:qacl@localhost:5432/qacl_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w apps/api
      - name: Apply migrations
        run: npm run db:deploy
      - name: Check that the schema and the migrations are in sync
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://qacl:qacl@localhost:5432/postgres
      - run: npm run test:e2e

  build:
    name: Build & Docker image
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w apps/api
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Build all-in-one image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: qa-commerce-lab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
