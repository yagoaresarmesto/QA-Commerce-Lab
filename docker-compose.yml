# QA Commerce Lab - local environment
#   docker compose up --build            → storefront :3000, API :3001, Swagger :3001/api/docs
#   docker compose --profile mail up     → also starts Mailpit (SMTP sink + web UI on :8025)
#   docker compose exec api node dist/prisma/seed.js --reset   → global reset (deterministic dataset)
name: qa-commerce-lab

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qacl
      POSTGRES_PASSWORD: qacl
      POSTGRES_DB: qacl
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qacl -d qacl"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: local
      PORT: 3001
      DATABASE_URL: postgresql://qacl:qacl@db:5432/qacl?schema=public
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789abcdef}
      TEST_API_ENABLED: "true"
      TEST_API_KEY: ${TEST_API_KEY:-local-test-api-key}
      ALLOW_GLOBAL_RESET: "true"
      RATE_LIMIT_ENABLED: "false"
      SEED_ON_START: ${SEED_ON_START:-if-empty}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: 1025
      LOG_PRETTY: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_APP_ENV: local
    environment:
      API_UPSTREAM: http://api:3001
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  db-data:
