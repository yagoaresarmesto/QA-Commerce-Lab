# Render Blueprint (alternative to the VPS). Creates two separate services from the same
# all-in-one Dockerfile, each with its own PostgreSQL database.
# Plan names/prices change: verify them on render.com/pricing before applying.
# Free Postgres instances expire after 30 days and free web services sleep when idle,
# so they are NOT suitable for a 24/7 lab (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: qacl-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: demo
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: qacl-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_WEB_URL
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: AUTO_RESET_CRON
        value: "0 4 * * *"

  - type: web
    name: qacl-testing
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: testing
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: qacl-testing-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TEST_API_KEY
        generateValue: true
      - key: PUBLIC_WEB_URL
        sync: false
      - key: ALLOW_GLOBAL_RESET
        value: "false"

databases:
  - name: qacl-demo-db
    plan: basic-256mb
    region: frankfurt
    databaseName: qacl_demo
  - name: qacl-testing-db
    plan: basic-256mb
    region: frankfurt
    databaseName: qacl_testing
